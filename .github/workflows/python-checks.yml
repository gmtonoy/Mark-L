name: Python checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q main.py ui.py actions memory dashboard
